# 엽록체의 각 부분은 어떤 일을 할까?
[구조] 엽록체 | 각 부분을 눌러 하는 일을 살펴보자.
- 외막 | 엽록체를 싸는 바깥 막이다.
- 내막 | 외막 안쪽의 막이다.
- 스트로마 | 타이라코이드를 제외한 나머지 공간으로, 포도당 합성에 관여하는 효소가 있다.
- 타이라코이드 | 내막 안의 납작한 주머니 모양 구조로, 막에 광합성색소와 전자전달계, ATP 합성효소가 있다.
- 그라나 | 타이라코이드가 여러 개 쌓여 있는 것이다.
- 타이라코이드 내부 | 타이라코이드 막으로 둘러싸인 공간이다.

# 미토콘드리아의 막은 어떻게 생겼을까?
[구조] 미토콘드리아 | 각 부분을 눌러 구조를 살펴보자.
- 외막 | 미토콘드리아를 싸는 바깥 막이다.
- 내막 | 안쪽으로 접혀 크리스타를 이루는 막이다.
- 막 사이 공간 | 외막과 내막 사이의 공간이다.
- 크리스타 | 내막이 안쪽으로 접혀 생긴 주름이다.
- 기질 | 내막으로 둘러싸인 안쪽 공간이다.
